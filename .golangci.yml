version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - revive
    - gosec
    - unconvert
    - misspell

  settings:
    misspell:
      # The repo standardized on American spelling; this keeps it that way
      # without anyone having to remember.
      locale: US

    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: error-strings
        - name: error-return
        - name: unreachable-code
        - name: redefines-builtin-id

  exclusions:
    rules:
      # Tests build deliberately odd states and drive fake clocks; gosec's
      # integer and randomness warnings are noise there.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
