# Actions are pinned by full commit SHA, not by tag. A tag is a mutable pointer
# in somebody else's repository: v5 moves whenever its owner moves it, and an
# action that is compromised or simply changed lands here on the next run with
# no diff in this file. A SHA is the artifact itself. The trailing comment is
# the human-readable version the SHA resolved to when it was written; Renovate
# updates both together (see renovate.json5).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build · vet · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod   # tracks go.mod; cannot drift from it
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test -race ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1  # pinned so a lint release cannot redden a green branch

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      # Reports only vulnerabilities on a call path this code actually reaches,
      # so a CVE in an unused corner of a dependency does not stop the world.
      - name: govulncheck
        # Pinned, for the same reason the actions above are. @latest also means
        # the scanner can change between two runs of the same commit, so a
        # green build turns red without anything in this repository moving --
        # which is indistinguishable from a real finding until someone reads
        # the diff that does not exist.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  identity:
    name: identity
    runs-on: ubuntu-latest
    steps:
      # The whole history, not a shallow clone: this job's entire job is to
      # check every commit that exists, and the default fetch-depth of 1 would
      # let it pass by only ever looking at one.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # core.hooksPath is per-clone configuration and does not survive a clone,
      # so the pre-push hook is not installed here and could not have run. This
      # is the server-side copy of the same rules: the one no clone can forget.
      - name: identity, trailers and tags over all history
        run: bash scripts/check-identity.sh

      # The self-test runs the real hook, and the hook refuses to pass when
      # gitleaks is absent -- deliberately, because a secrets gate that skips
      # when its scanner is missing is not a gate. That fail-closed branch is
      # what was firing here: the job never had the binary, so the hook's own
      # good-case test failed for a reason that had nothing to do with history.
      # The `secrets` job below runs gitleaks as a containerized action, which
      # never puts it on this job's PATH, so it is installed here directly.
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1   # pinned; a scanner release cannot redden a green branch
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: prove the pre-push gate rejects and accepts what it claims
        run: bash .githooks/selftest.sh

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: gitleaks over full history
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
