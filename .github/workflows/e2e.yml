name: e2e

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  failover:
    name: e2e-failover
    runs-on: ubuntu-latest
    # Generous: the job builds an image and then deliberately spends eighty
    # seconds watching a system change state. A tight timeout here would turn a
    # slow runner into a red build.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Starts the real stack, injects a real failure, and asserts on numbers
      # that must have changed: bargain served at least N more requests than
      # before, the failover counter moved, availability held above its floor,
      # and apex took traffic back after healing. A run where the gateway
      # silently served nothing would satisfy "no errors occurred"; it would
      # not satisfy any of those.
      - name: start the stack, break a provider, assert from parsed metrics
        run: bash test/e2e/failover.sh

      - name: gateway logs on failure
        if: failure()
        run: docker compose logs --no-color switchyard | tail -200
